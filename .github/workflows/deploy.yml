name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install
      # build runs `npm run vendor` first, copying three.js out of node_modules
      # into vendor/, then tsc into dist/. Both are gitignored, so the site is
      # only complete after this step.
      - run: npm run build

      # node_modules is ~60 MB here and nothing at runtime needs it; dist/ and
      # vendor/ are self-contained.
      - run: rm -rf node_modules

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
